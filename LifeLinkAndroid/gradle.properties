android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.code.style=official
# Build cache + parallel execution: reuse task outputs across CI runs and
# modules. The Gradle build cache is populated/restored by
# gradle/actions/setup-gradle in CI.
org.gradle.caching=true
org.gradle.parallel=true
# Configuration cache: reuse the configuration phase between runs. Problems are
# downgraded to warnings so an incompatible plugin degrades to a normal run
# instead of failing the build.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
