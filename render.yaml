services:
  - type: web
    name: lifelink-api
    runtime: docker
    rootDir: lifelink_fastapi
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: LIFELINK_DATABASE_URL
        sync: false
      - key: LIFELINK_AUTH_REQUIRED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: "authenticated"
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: LIFELINK_REQUIRE_VERIFIED_DONORS
        value: "false"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "5"
      # Push notifications stay disabled until this is set: app/fcm.py enables FCM
      # only when FIREBASE_SERVICE_ACCOUNT_JSON is present. Paste the Firebase
      # service-account JSON as the value in the Render dashboard; it is a secret
      # and must never be committed to the repository.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
