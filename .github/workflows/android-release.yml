name: Android Debug + Release Build

# Manual, on-demand build of BOTH a debug and a release APK.
#
# The debug APK is signed with the standard debug key (or the stable debug key
# when the LIFELINK_DEBUG_* secrets are present). The release APK is signed with
# the production keystore supplied through the LIFELINK_RELEASE_* secrets and is
# minified/shrunk by R8. If the release secrets are absent the release job still
# runs but produces an UNSIGNED, non-distributable APK and says so.
#
# See docs/ANDROID_RELEASE_SIGNING.md for the one-time keystore setup.

on:
  push:
    branches: [main, fix/build-actions]
    paths:
      - 'LifeLinkAndroid/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Which APK(s) to build'
        required: true
        default: both
        type: choice
        options:
          - both
          - debug
          - release
      api_base_url:
        description: 'LifeLink API base URL'
        required: false
        default: 'https://lifelink-api-uzje.onrender.com/'
        type: string
      supabase_url:
        description: 'Supabase project URL (leave blank to use repository secrets)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: android-debug-release-${{ github.ref }}-${{ inputs.build_type || 'both' }}
  cancel-in-progress: true

env:
  API_BASE_URL: ${{ inputs.api_base_url || 'https://lifelink-api-uzje.onrender.com/' }}
  SUPABASE_URL_VALUE: ${{ inputs.supabase_url || secrets.SUPABASE_URL }}
  # Publishable client key: safe to bundle into a mobile application.
  SUPABASE_KEY_VALUE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
  # Stable debug keystore (optional — keeps debug-installed apps updateable).
  LIFELINK_DEBUG_KEYSTORE_BASE64: ${{ secrets.LIFELINK_DEBUG_KEYSTORE_BASE64 }}
  LIFELINK_DEBUG_STORE_PASSWORD: ${{ secrets.LIFELINK_DEBUG_STORE_PASSWORD }}
  LIFELINK_DEBUG_KEY_ALIAS: ${{ secrets.LIFELINK_DEBUG_KEY_ALIAS }}
  LIFELINK_DEBUG_KEY_PASSWORD: ${{ secrets.LIFELINK_DEBUG_KEY_PASSWORD }}
  # Production release keystore (required for a distributable release APK).
  LIFELINK_RELEASE_KEYSTORE_BASE64: ${{ secrets.LIFELINK_RELEASE_KEYSTORE_BASE64 }}
  LIFELINK_RELEASE_STORE_PASSWORD: ${{ secrets.LIFELINK_RELEASE_STORE_PASSWORD }}
  LIFELINK_RELEASE_KEY_ALIAS: ${{ secrets.LIFELINK_RELEASE_KEY_ALIAS }}
  LIFELINK_RELEASE_KEY_PASSWORD: ${{ secrets.LIFELINK_RELEASE_KEY_PASSWORD }}
  # Firebase client config, consumed by the com.google.gms.google-services
  # plugin. Optional: when the secret is absent the committed
  # app/google-services.json is used as-is.
  GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

jobs:
  debug:
    name: Build debug APK
    if: ${{ (inputs.build_type || 'both') == 'both' || (inputs.build_type || 'both') == 'debug' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LifeLinkAndroid
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore Firebase config (optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Restore stable debug signing key
        if: ${{ env.LIFELINK_DEBUG_KEYSTORE_BASE64 != '' }}
        run: echo "$LIFELINK_DEBUG_KEYSTORE_BASE64" | base64 --decode > app/stable-debug.keystore

      - name: Build debug APK
        run: ./gradlew buildDebug -PversionCode="${{ github.run_number }}" -PlifelinkApiBaseUrl="$API_BASE_URL" -PsupabaseUrl="$SUPABASE_URL_VALUE" -PsupabasePublishableKey="$SUPABASE_KEY_VALUE" --no-daemon --stacktrace

      - name: Stage debug APK
        run: |
          mkdir -p ../android-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../android-artifacts/lifelink-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lifelink-debug-${{ github.sha }}
          path: android-artifacts/lifelink-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build release APK
    if: ${{ (inputs.build_type || 'both') == 'both' || (inputs.build_type || 'both') == 'release' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LifeLinkAndroid
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore Firebase config (optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Restore release signing key
        if: ${{ env.LIFELINK_RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$LIFELINK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lifelink-release.keystore"
          echo "LIFELINK_RELEASE_KEYSTORE=$RUNNER_TEMP/lifelink-release.keystore" >> "$GITHUB_ENV"

      - name: Warn when release signing is not configured
        if: ${{ env.LIFELINK_RELEASE_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::warning::LIFELINK_RELEASE_KEYSTORE_BASE64 is not set — the release APK will be UNSIGNED and cannot be published. See docs/ANDROID_RELEASE_SIGNING.md."

      - name: Build release APK
        run: ./gradlew assembleRelease -PversionCode="${{ github.run_number }}" -PlifelinkApiBaseUrl="$API_BASE_URL" -PsupabaseUrl="$SUPABASE_URL_VALUE" -PsupabasePublishableKey="$SUPABASE_KEY_VALUE" --no-daemon --stacktrace

      - name: Verify release APK signing
        if: ${{ env.LIFELINK_RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          verification=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk")
          echo "$verification"
          if echo "$verification" | grep -q "does not verify\|DOES NOT VERIFY"; then
            echo "::error::The release APK is not correctly signed."
            exit 1
          fi

      - name: Stage release APK
        run: |
          mkdir -p ../android-artifacts
          cp app/build/outputs/apk/release/app-release.apk ../android-artifacts/lifelink-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: lifelink-release-${{ github.sha }}
          path: android-artifacts/lifelink-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release mapping (for deobfuscating crashes)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lifelink-release-mapping-${{ github.sha }}
          path: |
            LifeLinkAndroid/app/build/outputs/mapping/release/mapping.txt
            LifeLinkAndroid/app/build/outputs/mapping/release/configuration.txt
            LifeLinkAndroid/app/build/outputs/mapping/release/seeds.txt
          if-no-files-found: warn
          retention-days: 30
