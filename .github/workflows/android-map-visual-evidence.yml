name: Android map visual evidence

on:
  pull_request:
    paths:
      - "LifeLinkAndroid/**"
      - ".github/workflows/android-map-visual-evidence.yml"
  push:
    branches: [main]
    paths:
      - "LifeLinkAndroid/**"
      - ".github/workflows/android-map-visual-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-map-visual-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-review:
    name: Run Android instrumentation and capture evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SERIAL: emulator-5554
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK and API 36 emulator
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "platforms;android-36" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

      - name: Enable KVM access for the hosted runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::This Linux runner does not expose /dev/kvm; the x86_64 Android emulator cannot run here."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Create and boot Android 16 emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd --force \
            -n lifelink-api36 \
            -k "system-images;android-36;google_apis;x86_64" \
            --device "pixel_2"
          mkdir -p "$RUNNER_TEMP/lifelink-visual-evidence"
          "$ANDROID_HOME/emulator/emulator" \
            -avd lifelink-api36 \
            -no-window -no-audio -no-boot-anim \
            -no-snapshot -no-snapshot-save \
            -accel on -gpu swiftshader_indirect -camera-back none \
            -cores 2 -memory 2048 \
            > "$RUNNER_TEMP/lifelink-emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/lifelink-emulator.pid"
          timeout 10s adb start-server
          timeout 120s adb wait-for-device

          deadline=$((SECONDS + 1200))
          attempt=0
          ready=false
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            booted="$(timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            input_service="$(timeout 5s adb shell service check input 2>/dev/null || true)"
            settings_service="$(timeout 5s adb shell service check settings 2>/dev/null || true)"
            if [[ "$booted" == "1" && "$input_service" == *"found"* && "$settings_service" == *"found"* ]]; then
              echo "Android framework and input services are ready."
              ready=true
              break
            fi
            if (( attempt % 6 == 0 )); then
              echo "Waiting for Android readiness (attempt $attempt; boot=$booted; input=$input_service; settings=$settings_service)."
              timeout 10s adb devices || true
            fi
            sleep 2
          done

          if [[ "$ready" != true ]]; then
            echo "::error::Android emulator did not become ready within 20 minutes."
            timeout 10s adb devices || true
            tail -n 200 "$RUNNER_TEMP/lifelink-emulator.log" || true
            exit 1
          fi

          timeout 10s adb shell settings put global window_animation_scale 0.0
          timeout 10s adb shell settings put global transition_animation_scale 0.0
          timeout 10s adb shell settings put global animator_duration_scale 0.0
          timeout 10s adb devices

      - name: Run all Android instrumentation tests with isolated test configuration
        shell: bash
        working-directory: LifeLinkAndroid
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:connectedDebugAndroidTest \
            -PlifelinkApiBaseUrl=https://api.example.invalid/ \
            -PlifelinkApiToken=synthetic-visual-test \
            -PsupabaseUrl=https://supabase.example.invalid \
            -PsupabasePublishableKey=synthetic-visual-test \
            --stacktrace

      - name: Collect emulator logs, screenshots, and test reports
        if: always()
        shell: bash
        run: |
          set +e
          evidence="$RUNNER_TEMP/lifelink-visual-evidence"
          mkdir -p "$evidence"
          timeout 15s adb logcat -d -v threadtime > "$evidence/logcat.txt" 2>&1 || true
          timeout 15s adb exec-out screencap -p > "$evidence/emulator-final-screen.png" 2>/dev/null || true
          # Pull external app files, then explicitly copy private fallback screenshots.
          timeout 20s adb pull /sdcard/Android/data/com.lifelink.app/files "$evidence/external-files" >/dev/null 2>&1 || true
          private_pngs="$(timeout 10s adb shell run-as com.lifelink.app find files -type f -name '*.png' -print 2>/dev/null | tr -d '\\r' || true)"
          if [[ -n "$private_pngs" ]]; then
            while IFS= read -r relative_path; do
              [[ -n "$relative_path" ]] || continue
              filename="$(basename "$relative_path")"
              timeout 10s adb exec-out run-as com.lifelink.app cat "$relative_path" > "$evidence/$filename" 2>/dev/null || true
              [[ -s "$evidence/$filename" ]] || rm -f "$evidence/$filename"
            done <<< "$private_pngs"
          fi
          echo "External app files:"
          timeout 10s adb shell find /sdcard/Android/data/com.lifelink.app/files -type f -name '*.png' -print 2>&1 || true
          echo "Private app PNG files:"
          timeout 10s adb shell run-as com.lifelink.app find files -type f -name '*.png' -print 2>&1 || true
          cp -R LifeLinkAndroid/app/build/reports/androidTests "$evidence/" 2>/dev/null
          cp -R LifeLinkAndroid/app/build/outputs/androidTest-results "$evidence/" 2>/dev/null
          cp -R LifeLinkAndroid/app/build/reports/tests "$evidence/" 2>/dev/null
          cp "$RUNNER_TEMP/lifelink-emulator.log" "$evidence/" 2>/dev/null
          find "$evidence" -type f -print || true

      - name: Require expected screenshots in the evidence artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/lifelink-visual-evidence"
          for pattern in '*workflow-home.png' '*workflow-donor-map.png'; do
            if ! find "$evidence" -type f -name "$pattern" -print -quit | grep -q .; then
              echo "::error::Required workflow screenshot is missing: $pattern"
              find "$evidence" -type f -print || true
              exit 1
            fi
          done

      - name: Stop Android emulator
        if: always()
        shell: bash
        run: |
          timeout 10s adb emu kill || true
          if [[ -f "$RUNNER_TEMP/lifelink-emulator.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/lifelink-emulator.pid")" 2>/dev/null || true
          fi

      - name: Upload Android visual evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lifelink-android-map-visual-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/lifelink-visual-evidence/
          if-no-files-found: warn
          retention-days: 14
