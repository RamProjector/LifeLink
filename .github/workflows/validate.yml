name: Validate cloud package

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifelink_fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: pytest -q

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LifeLinkAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Run Android unit tests, lint, and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace
      - name: Upload Android validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-reports-${{ github.sha }}
          path: |
            LifeLinkAndroid/app/build/reports/**
            LifeLinkAndroid/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f lifelink_fastapi/Dockerfile lifelink_fastapi
