name: Validate cloud package

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # The unit tests use the in-memory development app and intentionally omit JWTs.
      # Render production keeps LIFELINK_AUTH_REQUIRED=true in render.yaml.
      LIFELINK_AUTH_REQUIRED: 'false'
    defaults:
      run:
        working-directory: lifelink_fastapi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Install PostgreSQL integration-test server
        run: pip install pgserver
      - name: Require PostgreSQL integration-test server
        run: python -c "import pgserver; print('pgserver is available; PostgreSQL end-to-end tests must run')"
      - run: python -m compileall -q app tests
      - name: Check every table has an explicit RLS decision
        run: python ../scripts/check_rls_policies.py
      - name: Run backend tests including PostgreSQL end-to-end tests
        run: pytest -q -rs

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifelink_fastapi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check app tests
      - name: Mypy type check
        run: mypy app

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LifeLinkAndroid
    steps:
      - uses: actions/checkout@v7
        with:
          # Spotless ratchets against origin/main; a shallow checkout has no such
          # ref, so fetch enough history for the ratchet to resolve.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.2 build-tools;37.0.0'
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Ensure the Spotless ratchet ref exists
        run: git rev-parse --verify --quiet origin/main || git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Run Android quality gate (lint, detekt, spotless, unit tests, debug build)
        # Mirrors the committed pre-push hook (.githooks/pre-push) so a local
        # pass means a CI pass. `lint` covers debug + release; detekt and
        # spotlessCheck are the static-analysis/format gates.
        run: ./gradlew lint detekt spotlessCheck testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Upload Android validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-validation-reports-${{ github.sha }}
          path: |
            LifeLinkAndroid/app/build/reports/**
            LifeLinkAndroid/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f lifelink_fastapi/Dockerfile lifelink_fastapi
