name: Optional Android visual evidence

# This is an evidence workflow, not a merge gate. It boots a hosted emulator,
# runs the existing Compose workflow tests, and uploads real device screenshots.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci/optional-android-visual-evidence
  pull_request:
    paths:
      - "LifeLinkAndroid/**"
      - ".github/workflows/android-visual-evidence.yml"

permissions:
  contents: read

concurrency:
  group: android-visual-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-evidence:
    name: Boot emulator, exercise UI, collect screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # API 37 was unavailable in the hosted runner's SDK package index.
      # API 36 boots successfully; keep this workflow optional, not a merge gate.
      - name: Boot Android 16 (API 36) emulator and run Compose visual walkthrough
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          # Use a lower-resolution AVD to reduce cold-boot pressure on hosted runners.
          profile: pixel_2
          # Explicitly disable snapshot loading/saving: missing snapshots were
          # causing slow cold boots on the hosted runner.
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -camera-back none -cores 2 -memory 2048
          emulator-boot-timeout: 1200
          disable-animations: true
          working-directory: LifeLinkAndroid
          script: |
            set -o pipefail
            mkdir -p "$RUNNER_TEMP/lifelink-visual-evidence"
            # Collect screenshots before android-emulator-runner shuts the AVD down.
            # An EXIT trap is too late: the action's post-step cleanup can kill adb first.
            adb devices
            adb shell getprop sys.boot_completed | grep -q 1
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.lifelink.app.LifeLinkWorkflowVisualTest
            adb pull /sdcard/Android/data/com.lifelink.app/files "$RUNNER_TEMP/lifelink-visual-evidence/device-files" || true
            # VisualEvidence falls back to app-private storage if shared storage is unavailable.
            mkdir -p "$RUNNER_TEMP/lifelink-visual-evidence/private-files"
            adb shell run-as com.lifelink.app tar -C files -cf - lifelink-evidence 2>/dev/null | tar -xf - -C "$RUNNER_TEMP/lifelink-visual-evidence/private-files" 2>/dev/null || true
            # Keep a final emulator frame as supplemental evidence, not as the main screenshots.
            adb exec-out screencap -p > "$RUNNER_TEMP/lifelink-visual-evidence/emulator-screen.png" 2>/dev/null || true
            find "$RUNNER_TEMP/lifelink-visual-evidence" -type f -print

      - name: List collected visual evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lifelink-visual-evidence"
          find "$RUNNER_TEMP/lifelink-visual-evidence" -type f -print || true

      - name: Upload real emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifelink-visual-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/lifelink-visual-evidence/
          if-no-files-found: warn
          retention-days: 14
