name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'LifeLink API base URL'
        required: false
        default: 'https://lifelink-api-uzje.onrender.com/'
        type: string
      supabase_url:
        description: 'Supabase project URL (leave blank to use repository secrets)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  API_BASE_URL: ${{ inputs.api_base_url || 'https://lifelink-api-uzje.onrender.com/' }}
  SUPABASE_URL_VALUE: ${{ inputs.supabase_url || secrets.SUPABASE_URL }}
  SUPABASE_KEY_VALUE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
  GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build connected debug APK only
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LifeLinkAndroid
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore Firebase client configuration when configured
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi

      - name: Check Firebase client configuration
        run: |
          if [ -f app/google-services.json ]; then
            echo "Firebase client configuration restored."
          else
            echo "Firebase client configuration is not configured; building without FCM project metadata."
          fi

      - name: Run Android unit tests and lint before packaging
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Build debug APK only
        run: ./gradlew assembleDebug -PlifelinkApiBaseUrl="$API_BASE_URL" -PsupabaseUrl="$SUPABASE_URL_VALUE" -PsupabasePublishableKey="$SUPABASE_KEY_VALUE" --no-daemon --stacktrace

      - name: Rename debug APK
        run: |
          mkdir -p ../android-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../android-artifacts/lifelink-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lifelink-debug-${{ github.sha }}
          path: android-artifacts/lifelink-debug.apk
          if-no-files-found: error
          retention-days: 14
