name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'LifeLink API base URL'
        required: false
        default: 'https://lifelink-api-uzje.onrender.com/'
        type: string
      supabase_url:
        description: 'Supabase project URL (leave blank to use repository secrets)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  API_BASE_URL: ${{ inputs.api_base_url || 'https://lifelink-api-uzje.onrender.com/' }}
  SUPABASE_URL_VALUE: ${{ inputs.supabase_url || secrets.SUPABASE_URL }}
  SUPABASE_KEY_VALUE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build connected debug APK only
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LifeLinkAndroid
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Validate Supabase build secrets
        shell: bash
        run: |
          set -euo pipefail
          expected_supabase_url="https://nphbhlxnujmylhubzmne.supabase.co"
          expected_api_url="https://lifelink-api-uzje.onrender.com/"
          if [[ -z "$SUPABASE_URL_VALUE" ]]; then
            echo "::error::SUPABASE_URL is not configured in GitHub Actions secrets. Refusing to build a keyless APK."
            exit 1
          fi
          if [[ -z "$SUPABASE_KEY_VALUE" ]]; then
            echo "::error::SUPABASE_PUBLISHABLE_KEY is not configured in GitHub Actions secrets. Refusing to build a keyless APK."
            exit 1
          fi
          if [[ "$SUPABASE_URL_VALUE" != https://* ]]; then
            echo "::error::SUPABASE_URL must use https:// in the Android build."
            exit 1
          fi
          if [[ "$SUPABASE_URL_VALUE" != "$expected_supabase_url" ]]; then
            echo "::error::SUPABASE_URL must be $expected_supabase_url for the LifeLink app."
            exit 1
          fi
          if [[ "$API_BASE_URL" != "$expected_api_url" ]]; then
            echo "::error::API_BASE_URL must be $expected_api_url for the LifeLink app."
            exit 1
          fi
          echo "Validated LifeLink API and Supabase build configuration."

      - name: Build debug APK only
        run: ./gradlew assembleDebug -PlifelinkApiBaseUrl="$API_BASE_URL" -PsupabaseUrl="$SUPABASE_URL_VALUE" -PsupabasePublishableKey="$SUPABASE_KEY_VALUE" --no-daemon --stacktrace

      - name: Rename debug APK
        run: |
          mkdir -p ../android-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../android-artifacts/lifelink-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lifelink-debug-${{ github.sha }}
          path: android-artifacts/lifelink-debug.apk
          if-no-files-found: error
          retention-days: 14
