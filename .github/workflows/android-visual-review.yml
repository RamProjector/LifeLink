name: Android visual review

on:
  pull_request:
    paths:
      - 'LifeLinkAndroid/**'
      - '.github/workflows/android-visual-review.yml'
  workflow_dispatch:

  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-visual-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-review:
    name: Capture Android visual evidence
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LifeLinkAndroid
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build visual-test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Prepare emulator test script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/lifelink-visual-test.sh" <<'EOF'
          #!/usr/bin/env bash
          set +e
          device_serial="${ANDROID_SERIAL:-emulator-5554}"
          device_ready=0
          for attempt in $(seq 1 90); do
            adb reconnect offline >/dev/null 2>&1 || true
            device_state="$(adb -s "$device_serial" get-state 2>/dev/null || true)"
            boot_completed="$(adb -s "$device_serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$device_state" == "device" && "$boot_completed" == "1" ]]; then
              device_ready=1
              break
            fi
            sleep 5
          done
          if [[ "$device_ready" != "1" ]]; then
            adb devices -l || true
            exit 2
          fi
          cd "$GITHUB_WORKSPACE/LifeLinkAndroid" || exit 1
          ./gradlew connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --no-daemon --stacktrace
          test_exit=$?
          mkdir -p "$GITHUB_WORKSPACE/visual-artifacts"
          for remote_file in $(adb -s "$device_serial" shell ls /sdcard/Android/data/com.lifelink.app/files/lifelink-*.png 2>/dev/null | tr -d '\r'); do
            adb -s "$device_serial" pull "$remote_file" "$GITHUB_WORKSPACE/visual-artifacts/" || true
          done
          adb -s "$device_serial" logcat -d > "$GITHUB_WORKSPACE/visual-artifacts/logcat.txt" || true
          echo "$test_exit" > "$GITHUB_WORKSPACE/visual-artifacts/visual-test-exit-code.txt"
          exit "$test_exit"
          EOF
          chmod +x "$RUNNER_TEMP/lifelink-visual-test.sh"

      - name: Run visual smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-spellchecker: true
          disable-animations: true
          script: |
            bash "$RUNNER_TEMP/lifelink-visual-test.sh"

      - name: Collect visual test reports
        if: always()
        run: |
          mkdir -p ../visual-artifacts
          if [[ -d app/build/reports/androidTests/connected ]]; then
            cp -R app/build/reports/androidTests/connected ../visual-artifacts/android-test-report
          fi
          if [[ -d app/build/outputs/androidTest-results ]]; then
            cp -R app/build/outputs/androidTest-results ../visual-artifacts/test-results
          fi

      - name: Upload visual evidence and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifelink-android-visual-review-${{ github.sha }}
          path: visual-artifacts/**
          if-no-files-found: warn
          retention-days: 14
