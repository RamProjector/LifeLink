name: Android visual review

on:
  pull_request:
    paths:
      # Keep visual review focused on UI, resources, and the visual test harness.
      # Functional/build/unit-test validation still runs on every Android change in validate.yml.
      - 'LifeLinkAndroid/app/src/main/java/com/lifelink/app/core/navigation/**'
      - 'LifeLinkAndroid/app/src/main/java/com/lifelink/app/core/ui/**'
      - 'LifeLinkAndroid/app/src/main/java/com/lifelink/app/feature/**/Screen.kt'
      - 'LifeLinkAndroid/app/src/main/res/**'
      - 'LifeLinkAndroid/app/src/main/AndroidManifest.xml'
      - 'LifeLinkAndroid/app/src/androidTest/**'
      - 'LifeLinkAndroid/app/build.gradle.kts'
      - 'LifeLinkAndroid/build.gradle.kts'
      - 'LifeLinkAndroid/settings.gradle.kts'
      - 'LifeLinkAndroid/gradle/**'
      - 'LifeLinkAndroid/gradle.properties'
      # The workflow itself must be in the trigger list, otherwise a change that
      # only edits this file would never run it.
      - '.github/workflows/android-visual-review.yml'
  workflow_dispatch:

  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-visual-review-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the emulator image. Bump API_LEVEL only when the
  # app's minSdk/targetSdk or the visual harness actually requires it; a lower
  # API level boots faster and keeps the AVD snapshot cache key stable.
  API_LEVEL: 34
  AVD_TARGET: google_apis
  AVD_ARCH: x86_64
  AVD_PROFILE: pixel_2
  # Bump to invalidate the cached AVD snapshot after changing emulator options.
  AVD_CACHE_VERSION: v1

jobs:
  visual-review:
    name: Capture Android visual evidence
    runs-on: ubuntu-latest
    # The job used to allow 60 minutes; with KVM + a cached AVD snapshot it
    # should finish in a few minutes, so fail fast instead of hanging.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: LifeLinkAndroid
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Provides the Gradle build cache and dependency cache. This is what makes
      # the second and later runs skip recompiling unchanged modules.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # GitHub's ubuntu-latest runners expose /dev/kvm but the runner user is not
      # in the kvm group, so the emulator falls back to pure software emulation
      # (-accel off), which is the dominant cost of this job. Granting access lets
      # the emulator use hardware acceleration and cuts the run dramatically.
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM is available: $(ls -l /dev/kvm)"
          else
            echo "::error::/dev/kvm is not accessible; the emulator would fall back to software emulation and this job would be slow."
            exit 1
          fi

      - name: Build visual-test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Prepare emulator test script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/lifelink-visual-test.sh" <<'EOF'
          #!/usr/bin/env bash
          set +e
          device_serial="${ANDROID_SERIAL:-emulator-5554}"
          collect_diagnostics() {
            local script_exit=$?
            mkdir -p "$GITHUB_WORKSPACE/visual-artifacts"
            adb devices -l > "$GITHUB_WORKSPACE/visual-artifacts/adb-devices.txt" 2>&1 || true
            timeout 10s adb -s "$device_serial" get-state > "$GITHUB_WORKSPACE/visual-artifacts/adb-device-state.txt" 2>&1 || true
            timeout 10s adb -s "$device_serial" shell getprop sys.boot_completed > "$GITHUB_WORKSPACE/visual-artifacts/boot-completed.txt" 2>&1 || true
            timeout 15s adb -s "$device_serial" logcat -d -t 5000 > "$GITHUB_WORKSPACE/visual-artifacts/logcat.txt" 2>&1 || true
            for remote_file in $(timeout 10s adb -s "$device_serial" shell ls /sdcard/Android/data/com.lifelink.app/files/lifelink-*.png 2>/dev/null | tr -d '\r'); do
              timeout 15s adb -s "$device_serial" pull "$remote_file" "$GITHUB_WORKSPACE/visual-artifacts/" || true
            done
            for evidence_file in $(timeout 10s adb -s "$device_serial" shell run-as com.lifelink.app ls files/lifelink-evidence 2>/dev/null | tr -d '\r' | grep -E '^lifelink-.*\.png$'); do
              timeout 15s adb -s "$device_serial" exec-out run-as com.lifelink.app cat "files/lifelink-evidence/$evidence_file" > "$GITHUB_WORKSPACE/visual-artifacts/$evidence_file" || true
            done
            echo "$script_exit" > "$GITHUB_WORKSPACE/visual-artifacts/visual-test-exit-code.txt"
            exit "$script_exit"
          }
          trap collect_diagnostics EXIT
          device_ready=0
          boot_wait_started=$(date +%s)
          for attempt in $(seq 1 24); do
            adb reconnect offline >/dev/null 2>&1 || true
            device_state="$(adb -s "$device_serial" get-state 2>/dev/null || true)"
            boot_completed="$(adb -s "$device_serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$device_state" == "device" && "$boot_completed" == "1" ]]; then
              device_ready=1
              echo "Emulator became ready after $(( $(date +%s) - boot_wait_started )) seconds."
              break
            fi
            sleep 5
          done
          if [[ "$device_ready" != "1" ]]; then
            adb devices -l || true
            echo "::error::Emulator did not become ready within 120 seconds after the emulator action returned."
            exit 2
          fi
          cd "$GITHUB_WORKSPACE/LifeLinkAndroid" || exit 1
          echo "Starting connected Android instrumentation tests."
          ./gradlew connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace
          test_exit=$?
          exit "$test_exit"
          EOF
          chmod +x "$RUNNER_TEMP/lifelink-visual-test.sh"

      # Cache the AVD (including its boot snapshot) and the downloaded system
      # image. On a cache hit the emulator boots from the snapshot instead of
      # cold-booting, which removes most of the emulator startup cost.
      - name: Cache AVD snapshot and system image
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_TARGET }}-${{ env.AVD_ARCH }}-${{ env.AVD_PROFILE }}-${{ env.AVD_CACHE_VERSION }}

      # On a cache miss, boot the emulator once and let it save a snapshot that
      # the cache step above persists for the next run.
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: false
          # No -no-snapshot here: the emulator must be allowed to save a snapshot
          # on exit so the cache step can persist it.
          emulator-options: -no-window -no-audio -no-boot-anim -no-metrics -camera-back none -camera-front none -netfast -gpu swiftshader_indirect
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 300
          disable-spellchecker: true
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run visual smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: false
          # -no-snapshot-save keeps the cached snapshot pristine; the emulator
          # still loads it, so boot is fast. -no-metrics / -camera-* none /
          # -netfast trim startup and runtime overhead; -gpu swiftshader_indirect
          # keeps rendering deterministic on a headless runner. Hardware
          # acceleration is provided by the KVM step above.
          emulator-options: -no-snapshot-save -no-window -no-audio -no-boot-anim -no-metrics -camera-back none -camera-front none -netfast -gpu swiftshader_indirect
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 300
          disable-spellchecker: true
          disable-animations: true
          script: |
            bash "$RUNNER_TEMP/lifelink-visual-test.sh"

      - name: Collect emulator diagnostics
        if: always()
        run: |
          mkdir -p ../visual-artifacts
          adb devices -l > ../visual-artifacts/adb-devices-post-step.txt 2>&1 || true
          timeout 10s adb -s "${ANDROID_SERIAL:-emulator-5554}" shell getprop sys.boot_completed > ../visual-artifacts/boot-completed-post-step.txt 2>&1 || true
          timeout 15s adb -s "${ANDROID_SERIAL:-emulator-5554}" logcat -d -t 5000 > ../visual-artifacts/logcat-post-step.txt 2>&1 || true

      - name: Collect visual test reports
        if: always()
        run: |
          mkdir -p ../visual-artifacts
          if [[ -d app/build/reports/androidTests/connected ]]; then
            cp -R app/build/reports/androidTests/connected ../visual-artifacts/android-test-report
          fi
          if [[ -d app/build/outputs/androidTest-results ]]; then
            cp -R app/build/outputs/androidTest-results ../visual-artifacts/test-results
          fi

      - name: Upload visual evidence and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifelink-android-visual-review-${{ github.sha }}
          path: visual-artifacts/**
          if-no-files-found: warn
          retention-days: 14
