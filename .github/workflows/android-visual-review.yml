name: Android visual review

on:
  pull_request:
    paths:
      - 'LifeLinkAndroid/app/src/main/java/com/lifelink/app/core/location/**'
      - 'LifeLinkAndroid/app/src/main/java/com/lifelink/app/feature/privacy/**'
      - 'LifeLinkAndroid/app/src/androidTest/**'
      - '.github/workflows/android-visual-review.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep PR emulator evidence attached to the exact tested commit; do not cancel
# an in-progress screenshot run when another small fix lands on the same PR.
concurrency:
  group: android-visual-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

env:
  # Single source of truth for the emulator image. Bump API_LEVEL only when the
  # app's minSdk/targetSdk or the visual harness actually requires it; a lower
  # API level boots faster and keeps the AVD snapshot cache key stable.
  API_LEVEL: 34
  AVD_TARGET: google_apis
  AVD_ARCH: x86_64
  AVD_PROFILE: pixel_2
  # MapLibre 11.8.0 uses OpenGL ES; disabling guest Vulkan avoids the software-renderer
  # color-buffer startup failure observed on Linux runners without KVM.
  # Bump after changing the guest architecture or emulator options to invalidate stale snapshots.
  AVD_CACHE_VERSION: v5

jobs:
  visual-review:
    name: Capture Android visual evidence
    runs-on: ubuntu-24.04
    # Focused map/navigation visual review on a standard Linux x86_64 runner.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: LifeLinkAndroid
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Provides the Gradle build cache and dependency cache. This is what makes
      # the second and later runs skip recompiling unchanged modules.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Diagnose OpenFreeMap runner connectivity
        id: map-network
        shell: bash
        run: |
          set +e
          mkdir -p ../visual-artifacts
          cat /etc/resolv.conf > ../visual-artifacts/runner-resolv.conf 2>&1 || true
          resolvectl status --no-pager > ../visual-artifacts/runner-resolvectl-status.txt 2>&1 || true
          dns_servers="$(resolvectl dns 2>/dev/null | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | grep -v '^127\.' | sort -u | paste -sd, -)"
          if [[ -z "$dns_servers" ]]; then
            dns_servers="8.8.8.8,1.1.1.1"
          fi
          echo "dns_servers=$dns_servers" >> "$GITHUB_OUTPUT"
          echo "$dns_servers" > ../visual-artifacts/emulator-dns-servers.txt
          getent ahostsv4 tiles.openfreemap.org > ../visual-artifacts/openfreemap-host-dns.txt 2>&1
          echo "$?" > ../visual-artifacts/openfreemap-host-dns-exit-code.txt
          curl -fsS --connect-timeout 10 --max-time 20 \
            -o ../visual-artifacts/openfreemap-style.json \
            -w 'HTTP %{http_code}\n' \
            https://tiles.openfreemap.org/styles/liberty \
            > ../visual-artifacts/openfreemap-style-http.txt 2>&1
          curl_exit=$?
          echo "$curl_exit" > ../visual-artifacts/openfreemap-style-exit-code.txt
          if [[ "$curl_exit" != "0" ]]; then
            echo "::warning::Runner could not fetch the OpenFreeMap style; emulator map rendering may be blocked by network/DNS."
          else
            echo "Runner can fetch the OpenFreeMap style JSON."
          fi

      # GitHub's Ubuntu runners usually expose /dev/kvm. If unavailable, use
      # software CPU emulation without skipping instrumentation or screenshots.
      - name: Enable native emulator virtualization
        id: kvm
        run: |
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM is available: $(ls -l /dev/kvm)"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::/dev/kvm is unavailable; software emulation may not boot reliably."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # android-emulator-runner detects /dev/kvm itself (disable-linux-hw-accel:auto).
      # Do not append a second -accel off: the action already adds it on runners
      # without KVM, and duplicate flags can leave the emulator/ADB offline.
      - name: Build visual-test APKs
        # --no-daemon: the runner has 16 GB and the emulator below claims 4 GB
        # (plus a 512 MB heap). A lingering Gradle daemon (-Xmx4096m) alongside
        # the emulator can exhaust the runner, so run this build in a
        # single-use daemon that exits when the step ends.
        run: ./gradlew assembleDebug assembleDebugAndroidTest assembleUiTest --no-daemon --stacktrace

      - name: Prepare emulator test script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/lifelink-visual-test.sh" <<'EOF'
          #!/usr/bin/env bash
          set +e
          mkdir -p "$GITHUB_WORKSPACE/visual-artifacts"
          device_serial="${ANDROID_SERIAL:-emulator-5554}"
          collect_diagnostics() {
            local script_exit=$?
            mkdir -p "$GITHUB_WORKSPACE/visual-artifacts"
            adb devices -l > "$GITHUB_WORKSPACE/visual-artifacts/adb-devices.txt" 2>&1 || true
            timeout 10s adb -s "$device_serial" get-state > "$GITHUB_WORKSPACE/visual-artifacts/adb-device-state.txt" 2>&1 || true
            timeout 10s adb -s "$device_serial" shell getprop sys.boot_completed > "$GITHUB_WORKSPACE/visual-artifacts/boot-completed.txt" 2>&1 || true
            timeout 15s adb -s "$device_serial" logcat -d -t 5000 > "$GITHUB_WORKSPACE/visual-artifacts/logcat.txt" 2>&1 || true
            grep -Eai 'MapLibre|org\.maplibre|tiles\.openfreemap|UnknownHostException|ConnectException|SSLHandshakeException' "$GITHUB_WORKSPACE/visual-artifacts/logcat.txt" > "$GITHUB_WORKSPACE/visual-artifacts/maplibre-logcat.txt" || true
            timeout 10s adb -s "$device_serial" shell getprop net.dns1 > "$GITHUB_WORKSPACE/visual-artifacts/emulator-dns1.txt" 2>&1 || true
            timeout 10s adb -s "$device_serial" shell getprop net.dns2 > "$GITHUB_WORKSPACE/visual-artifacts/emulator-dns2.txt" 2>&1 || true
            timeout 15s adb -s "$device_serial" shell dumpsys connectivity > "$GITHUB_WORKSPACE/visual-artifacts/emulator-connectivity.txt" 2>&1 || true
            timeout 10s adb -s "$device_serial" shell ip route > "$GITHUB_WORKSPACE/visual-artifacts/emulator-ip-route.txt" 2>&1 || true
            timeout 10s adb -s "$device_serial" shell settings get global private_dns_mode > "$GITHUB_WORKSPACE/visual-artifacts/emulator-private-dns-mode.txt" 2>&1 || true
            for remote_file in $(timeout 10s adb -s "$device_serial" shell ls /sdcard/Android/data/com.lifelink.app/files/lifelink-*.png 2>/dev/null | tr -d '\r'); do
              timeout 15s adb -s "$device_serial" pull "$remote_file" "$GITHUB_WORKSPACE/visual-artifacts/" || true
            done
            for evidence_file in $(timeout 10s adb -s "$device_serial" shell run-as com.lifelink.app ls files/lifelink-evidence 2>/dev/null | tr -d '\r' | grep -E '^lifelink-.*\.png$'); do
              timeout 15s adb -s "$device_serial" exec-out run-as com.lifelink.app cat "files/lifelink-evidence/$evidence_file" > "$GITHUB_WORKSPACE/visual-artifacts/$evidence_file" || true
            done
            echo "$script_exit" > "$GITHUB_WORKSPACE/visual-artifacts/visual-test-exit-code.txt"
            exit "$script_exit"
          }
          trap collect_diagnostics EXIT
          device_ready=0
          boot_wait_started=$(date +%s)
          # Software CPU emulation can take several minutes on runners without KVM.
          for attempt in $(seq 1 120); do
            adb reconnect offline >/dev/null 2>&1 || true
            device_state="$(adb -s "$device_serial" get-state 2>/dev/null || true)"
            boot_completed="$(adb -s "$device_serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$device_state" == "device" && "$boot_completed" == "1" ]]; then
              device_ready=1
              echo "Emulator became ready after $(( $(date +%s) - boot_wait_started )) seconds."
              break
            fi
            sleep 5
          done
          if [[ "$device_ready" != "1" ]]; then
            adb devices -l || true
            echo "::error::Emulator did not become ready within 600 seconds after the emulator action returned."
            exit 2
          fi
          # The cached AVD snapshot may already contain the app installed by a
          # previous run, signed with that runner's debug keystore. The freshly
          # built APK is signed with this runner's keystore, so installing over
          # the stale package fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
          # Uninstall first so the install is always clean.
          adb -s "$device_serial" uninstall com.lifelink.app >/dev/null 2>&1 || true
          adb -s "$device_serial" uninstall com.lifelink.app.test >/dev/null 2>&1 || true
          cd "$GITHUB_WORKSPACE/LifeLinkAndroid" || exit 1
          echo "Starting connected Android instrumentation tests."
          # --no-daemon: this step runs while the emulator is live, so avoid
          # keeping a 4 GB Gradle daemon resident next to the 4 GB emulator.
          # This workflow is the visual-evidence gate, not the full instrumentation
          # regression suite. Run the selected map, navigation, and recovery journeys
          # here; the APK build compiles every instrumentation test, while unit/backend
          # suites remain separate checks.
          # A single suite avoids AndroidJUnitRunner silently accepting only the first mixed class/method selector.
          visual_test_classes="com.lifelink.app.LifeLinkVisualReviewSuite"
          ./gradlew connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class="$visual_test_classes" \
            -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true \
            --no-daemon --stacktrace
          test_exit=$?
          if [[ "$test_exit" == "0" ]]; then
            test_results_dir="$GITHUB_WORKSPACE/LifeLinkAndroid/app/build/outputs/androidTest-results"
            for expected_test in "AuthScreenVisualTest" "LifeLinkVisualSmokeTest" "ConversationNavigationSmokeTest" "DebugFileLoggerTest" "LifeLinkFeedbackCardTest" "navigatesCoreWorkflowsAndCapturesEvidence" "donorMapErrorKeepsMapVisibleAndRetryable" "emptyDonorMapKeepsMapVisibleAndOffersRefresh" "selectingDonorAreaOpensPrivacySafeDetailsAndReturnsToMap" "donor_can_open_chat_and_system_back_returns_to_the_donor_workspace" "unsaved_profile_radius_and_gps_controls_survive_full_screen_transitions" "donor_map_is_a_labeled_top_level_destination_and_navigation_remains_available" "donor_map_shows_the_correct_loading_error_and_empty_state" "syntheticMapMarkerTapSelectsTheMatchingApproximateAreaWithoutNetwork" "debugDiagnosticsAreReadableFromDownloads" "errorFeedbackShowsRecoveryActionAndInvokesIt"; do
              if ! grep -R -Fq "$expected_test" "$test_results_dir"; then
                echo "::error::Instrumentation result is missing expected visual coverage: $expected_test"
                find "$test_results_dir" -type f -maxdepth 5 -print 2>/dev/null | sort || true
                exit 9
              fi
            done
          fi
          if [[ "$test_exit" != "0" ]]; then
            echo "::error::Android instrumentation failed with exit code $test_exit. Inspect the uploaded test-results and logcat artifacts."
            echo "--- Failed instrumentation result files ---"
            find "$GITHUB_WORKSPACE/LifeLinkAndroid/app/build" -type f \
              \( -path '*/outputs/androidTest-results/*' -o -path '*/reports/androidTests/connected/*' \) \
              -print 2>/dev/null | sort || true
            echo "--- Failure and error excerpts ---"
            rg -n -i -C 2 'failure|error|exception|assertion|timeout|no tests found' \
              "$GITHUB_WORKSPACE/LifeLinkAndroid/app/build/outputs/androidTest-results" \
              "$GITHUB_WORKSPACE/LifeLinkAndroid/app/build/reports/androidTests/connected" \
              2>/dev/null | head -240 || true
          fi
          if [[ "$test_exit" == "0" ]]; then
            echo "Starting isolated fake-backend UI APK smoke test."
            ui_apk="$GITHUB_WORKSPACE/LifeLinkAndroid/app/build/outputs/apk/uiTest/app-uiTest.apk"
            if [[ ! -s "$ui_apk" ]]; then
              echo "::error::The fake-backend UI APK was not built."
              exit 3
            fi
            adb -s "$device_serial" uninstall com.lifelink.app.uitest >/dev/null 2>&1 || true
            adb -s "$device_serial" install "$ui_apk" || exit 4
            adb -s "$device_serial" logcat -c
            adb -s "$device_serial" shell monkey -p com.lifelink.app.uitest 1
            dialog_xml="$GITHUB_WORKSPACE/visual-artifacts/lifelink-ui-test-dialog.xml"
            dialog_deadline=$((SECONDS + 180))
            dialog_ready=0
            while (( SECONDS < dialog_deadline )); do
              if timeout 15s adb -s "$device_serial" shell uiautomator dump /sdcard/lifelink-ui-test-window.xml >/dev/null 2>&1 &&
                timeout 10s adb -s "$device_serial" shell cat /sdcard/lifelink-ui-test-window.xml > "$dialog_xml" 2>/dev/null &&
                grep -Fq "UI test build" "$dialog_xml"; then
                dialog_ready=1
                break
              fi
              if adb -s "$device_serial" logcat -d -t 3000 | grep -Fq "FATAL EXCEPTION"; then
                adb -s "$device_serial" logcat -d -t 3000 | tail -160
                echo "::error::The fake-backend UI app crashed before showing its warning."
                exit 8
              fi
              sleep 3
            done
            if [[ "$dialog_ready" != "1" ]]; then
              adb -s "$device_serial" logcat -d -t 3000 | tail -160
              echo "::error::The UI-test app did not show its fake-backend warning within 180 seconds."
              exit 5
            fi
            bounds=$(grep -o 'text="Continue demo"[^>]*' "$GITHUB_WORKSPACE/visual-artifacts/lifelink-ui-test-dialog.xml" | sed -E 's/.*bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]".*/\1 \2 \3 \4/' | head -1)
            if [[ "$bounds" =~ ^[0-9]+\ [0-9]+\ [0-9]+\ [0-9]+$ ]]; then
              read -r x1 y1 x2 y2 <<< "$bounds"
              adb -s "$device_serial" shell input tap "$(((x1+x2)/2))" "$(((y1+y2)/2))"
            else
              echo "::error::Could not locate the fake-backend warning's Continue demo button."
              exit 6
            fi
            home_xml="$GITHUB_WORKSPACE/visual-artifacts/lifelink-ui-test-home.xml"
            home_deadline=$((SECONDS + 120))
            home_ready=0
            while (( SECONDS < home_deadline )); do
              if timeout 15s adb -s "$device_serial" shell uiautomator dump /sdcard/lifelink-ui-test-home.xml >/dev/null 2>&1 &&
                timeout 10s adb -s "$device_serial" shell cat /sdcard/lifelink-ui-test-home.xml > "$home_xml" 2>/dev/null &&
                grep -Fq "Create emergency request" "$home_xml"; then
                home_ready=1
                break
              fi
              if adb -s "$device_serial" logcat -d -t 3000 | grep -Fq "FATAL EXCEPTION"; then
                adb -s "$device_serial" logcat -d -t 3000 | tail -160
                echo "::error::The fake-backend UI app crashed before reaching the requester workspace."
                exit 8
              fi
              sleep 3
            done
            if [[ "$home_ready" != "1" ]]; then
              adb -s "$device_serial" logcat -d -t 3000 | tail -160
              echo "::error::The fake-backend UI did not reach the requester workspace within 120 seconds."
              exit 7
            fi
            adb -s "$device_serial" shell screencap -p /sdcard/lifelink-ui-test-home.png
            adb -s "$device_serial" pull /sdcard/lifelink-ui-test-home.png "$GITHUB_WORKSPACE/visual-artifacts/lifelink-ui-test-home.png"
            if adb -s "$device_serial" logcat -d -t 5000 | grep -E 'FATAL EXCEPTION.*|Process: com\.lifelink\.app\.uitest'; then
              echo "::error::The fake-backend UI app crashed during smoke testing."
              exit 8
            fi
          fi
          exit "$test_exit"
          EOF
          chmod +x "$RUNNER_TEMP/lifelink-visual-test.sh"

      # Cache the AVD (including its boot snapshot) and the downloaded system
      # image. On a cache hit the emulator boots from the snapshot instead of
      # cold-booting, which removes most of the emulator startup cost.
      #
      # Credential hygiene: PR caches are restorable by base-branch runs, so
      # never cache anything that can hold secrets. We deliberately cache only
      # the AVD definition/snapshot and the SDK system image. The ADB key pair
      # (~/.android/adbkey, adbkey.pub) is NOT cached: it is a per-runner
      # credential, and a cached private key would be readable by other runs.
      # The emulator regenerates it on first use, which is harmless here.
      - name: Cache AVD snapshot and system image
        id: avd-cache
        if: steps.kvm.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            /usr/local/lib/android/sdk/system-images
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_TARGET }}-${{ env.AVD_ARCH }}-${{ env.AVD_PROFILE }}-${{ env.AVD_CACHE_VERSION }}

      # On a cache miss, boot the emulator once and let it save a snapshot that
      # the cache step above persists for the next run.
      - name: Create AVD and generate snapshot for caching
        if: steps.kvm.outputs.available == 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: false
          # No -no-snapshot here: the emulator must be allowed to save a snapshot
          # on exit so the cache step can persist it.
          emulator-options: -no-window -no-audio -no-boot-anim -no-metrics -camera-back none -camera-front none -netfast -dns-server ${{ steps.map-network.outputs.dns_servers }} -gpu swiftshader_indirect -feature -Vulkan
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 300
          disable-spellchecker: true
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run visual smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: false
          # Avoid loading a cached guest snapshot for the visual run. A stale or
          # partially saved Android snapshot can leave ADB connected while Android
          # never completes boot. Rebuild the guest state each run; cache still
          # accelerates SDK/system-image downloads, but screenshots must come from
          # a clean boot. Keep rendering deterministic on headless Linux runners.
          emulator-options: >-
            -no-snapshot-load -no-snapshot-save -no-window -no-audio -no-boot-anim -no-metrics
            -camera-back none -camera-front none -netfast -dns-server ${{ steps.map-network.outputs.dns_servers }} -gpu swiftshader_indirect -feature -Vulkan

          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-spellchecker: true
          disable-animations: true
          script: |
            bash "$RUNNER_TEMP/lifelink-visual-test.sh"

      - name: Collect emulator diagnostics
        if: always()
        run: |
          mkdir -p ../visual-artifacts
          adb devices -l > ../visual-artifacts/adb-devices-post-step.txt 2>&1 || true
          timeout 10s adb -s "${ANDROID_SERIAL:-emulator-5554}" shell getprop sys.boot_completed > ../visual-artifacts/boot-completed-post-step.txt 2>&1 || true
          timeout 15s adb -s "${ANDROID_SERIAL:-emulator-5554}" logcat -d -t 5000 > ../visual-artifacts/logcat-post-step.txt 2>&1 || true
          timeout 10s adb -s "${ANDROID_SERIAL:-emulator-5554}" shell getprop net.dns1 > ../visual-artifacts/emulator-dns1-post-step.txt 2>&1 || true
          timeout 10s adb -s "${ANDROID_SERIAL:-emulator-5554}" shell getprop net.dns2 > ../visual-artifacts/emulator-dns2-post-step.txt 2>&1 || true
          timeout 15s adb -s "${ANDROID_SERIAL:-emulator-5554}" shell dumpsys connectivity > ../visual-artifacts/emulator-connectivity-post-step.txt 2>&1 || true
          timeout 10s adb -s "${ANDROID_SERIAL:-emulator-5554}" shell ip route > ../visual-artifacts/emulator-ip-route-post-step.txt 2>&1 || true
          timeout 10s adb -s "${ANDROID_SERIAL:-emulator-5554}" shell settings get global private_dns_mode > ../visual-artifacts/emulator-private-dns-mode-post-step.txt 2>&1 || true

      - name: Collect visual test reports
        if: always()
        run: |
          mkdir -p ../visual-artifacts
          if [[ -d app/build/reports/androidTests/connected ]]; then
            cp -R app/build/reports/androidTests/connected ../visual-artifacts/android-test-report
          fi
          if [[ -d app/build/outputs/androidTest-results ]]; then
            cp -R app/build/outputs/androidTest-results ../visual-artifacts/test-results
          fi

      - name: Require rendered UI screenshots
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="../visual-artifacts"
          required=(
            "lifelink-auth-screen.png"
            "lifelink-phone-light-workflow-home.png"
            "lifelink-phone-light-workflow-donor-map.png"
            "lifelink-phone-light-donor-map-loading-state.png"
            "lifelink-phone-light-workflow-requests.png"
            "lifelink-phone-light-donor-map-error.png"
            "lifelink-phone-light-donor-map-empty.png"
            "lifelink-phone-light-donor-map-synthetic-marker-selected.png"
            "lifelink-phone-light-donor-map-synthetic-filtered-marker-selected.png"
            "lifelink-phone-light-donor-map-synthetic-marker-metadata-refreshed.png"
            "lifelink-donor-workspace-after-open.png"
          )
          for file in "${required[@]}"; do
            if [[ ! -s "$evidence_dir/$file" ]]; then
              echo "::error::Required visual evidence is missing or empty: $file"
              find "$evidence_dir" -maxdepth 2 -type f -print | sort || true
              exit 1
            fi
          done
          echo "Required home, rendered donor map, donor workspace, and requests screenshots are present."

      - name: Upload visual evidence and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lifelink-android-visual-review-${{ github.sha }}
          path: visual-artifacts/**
          if-no-files-found: error
          retention-days: 14
