name: Build Android APKs

on:
  push:
    branches: [main]
    paths:
      - 'LifeLinkAndroid/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'LifeLinkAndroid/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'LifeLink API base URL'
        required: false
        default: 'https://lifelink-api-uzje.onrender.com/'
        type: string
      supabase_url:
        description: 'Supabase project URL (leave blank to use repository secrets)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  API_BASE_URL: ${{ inputs.api_base_url || 'https://lifelink-api-uzje.onrender.com/' }}
  SUPABASE_URL_VALUE: ${{ inputs.supabase_url || secrets.SUPABASE_URL }}
  # Publishable client key: safe to bundle into a mobile application.
  SUPABASE_KEY_VALUE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug and release APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LifeLinkAndroid
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore Firebase client configuration when configured
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Check Firebase client configuration
        run: |
          if [ -f app/google-services.json ]; then
            echo "Firebase client configuration restored."
          else
            echo "Firebase client configuration is not configured; building without FCM project metadata."
          fi

      - name: Run Android unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug -PlifelinkApiBaseUrl="$API_BASE_URL" -PsupabaseUrl="$SUPABASE_URL_VALUE" -PsupabasePublishableKey="$SUPABASE_KEY_VALUE" --no-daemon --stacktrace

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect
          cores: 2
          ram-size: 4096M
          disk-size: 8G
          disable-animations: true
          force-avd-creation: true
          emulator-boot-timeout: 900
          working-directory: LifeLinkAndroid
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease -PlifelinkApiBaseUrl="$API_BASE_URL" -PsupabaseUrl="$SUPABASE_URL_VALUE" -PsupabasePublishableKey="$SUPABASE_KEY_VALUE" --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p ../android-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../android-artifacts/lifelink-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../android-artifacts/lifelink-release-unsigned.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lifelink-android-apks-${{ github.sha }}
          path: android-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
