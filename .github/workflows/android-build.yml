name: Build Android APKs

on:
  push:
    branches: [main]
    paths:
      - 'LifeLinkAndroid/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'LifeLinkAndroid/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'LifeLink API base URL'
        required: false
        default: 'https://lifelink-api-uzje.onrender.com/'
        type: string
      supabase_url:
        description: 'Supabase project URL (leave blank to use repository secrets)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  API_BASE_URL: ${{ inputs.api_base_url || 'https://lifelink-api-uzje.onrender.com/' }}
  SUPABASE_URL_VALUE: ${{ inputs.supabase_url || secrets.SUPABASE_URL }}
  # Publishable client key: safe to bundle into a mobile application.
  SUPABASE_KEY_VALUE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
  LIFELINK_DEBUG_KEYSTORE_BASE64: ${{ secrets.LIFELINK_DEBUG_KEYSTORE_BASE64 }}
  LIFELINK_DEBUG_STORE_PASSWORD: ${{ secrets.LIFELINK_DEBUG_STORE_PASSWORD }}
  LIFELINK_DEBUG_KEY_ALIAS: ${{ secrets.LIFELINK_DEBUG_KEY_ALIAS }}
  LIFELINK_DEBUG_KEY_PASSWORD: ${{ secrets.LIFELINK_DEBUG_KEY_PASSWORD }}

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LifeLinkAndroid
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Validate LifeLink build configuration
        shell: bash
        run: |
          set -euo pipefail
          expected_supabase_url="https://nphbhlxnujmylhubzmne.supabase.co"
          expected_api_url="https://lifelink-api-uzje.onrender.com/"
          [[ -n "$SUPABASE_URL_VALUE" ]] || { echo "::error::Missing SUPABASE_URL repository secret."; exit 1; }
          [[ -n "$SUPABASE_KEY_VALUE" ]] || { echo "::error::Missing SUPABASE_PUBLISHABLE_KEY repository secret."; exit 1; }
          [[ "$SUPABASE_URL_VALUE" == "$expected_supabase_url" ]] || { echo "::error::SUPABASE_URL must be $expected_supabase_url."; exit 1; }
          [[ "$API_BASE_URL" == "$expected_api_url" ]] || { echo "::error::API_BASE_URL must be $expected_api_url."; exit 1; }
          echo "Validated LifeLink API and Supabase build configuration."

      - name: Restore stable debug signing key
        if: ${{ env.LIFELINK_DEBUG_KEYSTORE_BASE64 != '' }}
        run: echo "$LIFELINK_DEBUG_KEYSTORE_BASE64" | base64 --decode > app/stable-debug.keystore

      - name: Validate and build debug APK
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug -PversionCode="${{ github.run_number }}" -PlifelinkApiBaseUrl="$API_BASE_URL" -PsupabaseUrl="$SUPABASE_URL_VALUE" -PsupabasePublishableKey="$SUPABASE_KEY_VALUE" --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p ../android-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../android-artifacts/lifelink-debug.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lifelink-android-apks-${{ github.sha }}
          path: android-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lifelink-android-validation-${{ github.sha }}
          path: |
            LifeLinkAndroid/app/build/reports/tests/
            LifeLinkAndroid/app/build/test-results/
            LifeLinkAndroid/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
